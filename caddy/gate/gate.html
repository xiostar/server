<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zugang</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08120f; color: #e9efe9; font: 16px/1.5 system-ui, sans-serif; }
  form { width: min(22rem, calc(100% - 2rem)); display: grid; gap: .8rem; padding: 1.4rem; border: 1px solid #234536; border-radius: 16px; background: #0f1d18; }
  h1 { margin: 0; font-size: 1.15rem; }
  input { font: inherit; padding: .75rem .9rem; border-radius: 10px; border: 1px solid #2c5543; background: #08120f; color: inherit; }
  button { font: inherit; font-weight: 700; padding: .75rem; border: 0; border-radius: 10px; background: #16d978; color: #03130b; cursor: pointer; }
  .err { color: #ff7a82; min-height: 1.2em; margin: 0; font-size: .9rem; }
</style>
</head>
<body>
<form id="f">
  <h1>Zugang</h1>
  <input id="p" type="password" autocomplete="current-password" placeholder="Passwort" required autofocus>
  <button>Weiter</button>
  <p class="err" id="e"></p>
</form>
<script>
  // Prüfung macht der Server: Er lässt nur durch, wer das passende Zugangs-Cookie hat.
  // Das Cookie gilt etwa ein Jahr für die ganze Domain (alle Unteradressen).
  const e = document.getElementById("e");
  try { if (sessionStorage.getItem("gate-try")) e.textContent = "Falsches Passwort."; } catch (x) {}
  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pw = document.getElementById("p").value;
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
    const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    const parts = location.hostname.split(".");
    const domain = parts.length >= 2 ? "; Domain=." + parts.slice(-2).join(".") : "";
    document.cookie = "__COOKIE__=" + hex + "; Max-Age=34560000; Path=/" + domain + "; Secure; SameSite=Lax";
    try { sessionStorage.setItem("gate-try", "1"); } catch (x) {}
    location.reload();
  });
</script>
</body>
</html>

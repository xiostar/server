# Eigene Adressen (Subdomains) für einzelne Apps.
# Format: <adresse> <app-name aus apps.conf>
#  - Beim Domain-Anbieter vorher einen A-Record für die Adresse auf die Server-IP setzen.
#  - Caddy holt für jede Adresse automatisch ein HTTPS-Zertifikat.
#  - Die Startseite der Adresse führt direkt in die App; /<app-name>/ funktioniert weiterhin.
#  - "-" statt App-Name: die Adresse zeigt nur eine leere Seite.
#  - Optionen nach dem App-Namen:
#      gate          erst nach einmaliger Eingabe des gemeinsamen Zugangspassworts (bin/set-gate 'pw')
#      gate=NAME     eigenes Passwort nur für diese Adresse (bin/set-gate -n NAME 'pw')
#      exklusiv      App NUR über diese Adresse: /<app>/ auf IP/Hauptdomain leitet hierher um
#                    (damit niemand das Passwort über den alten Pfad umgeht; greift erst, wenn das Passwort gesetzt ist)
oche-legacy.casiotc.eu  dart-karriere  gate
casiotc.eu              -
www.casiotc.eu          -
# Stundenanker (eigenes Passwort: bin/set-gate -n stundenanker 'pw')
stundenanker.casiotc.eu  stempelzeitkontrolle  gate=stundenanker  exklusiv
